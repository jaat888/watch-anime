<style>
:root{--bg:#f4f3ef;--panel:#fff;--panel2:#efede8;--line:#e2dfd8;--text:#181a21;--dim:#656a79;--accent:#e4472a;--accent2:#ff8a3d;--glass:rgba(244,243,239,.86)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center}
.logo{font-weight:800;font-size:19px;cursor:pointer;white-space:nowrap;letter-spacing:.2px}.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

main{max-width:1180px;margin:0 auto;padding:16px 16px 8px;min-height:70vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.glass{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:600}

.countdown div{display:flex;gap:8px}.countdown button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:7px 12px}.countdown .go{background:var(--accent)}

.hero .pri,.hero .glass{padding:8px 16px;font-size:14px}.ept{padding:0 10px 2px;font-size:11px;font-weight:700;color:var(--accent)}.ept span{color:var(--dim);font-weight:500}
.tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

video{width:100%;height:100%;display:block}

.sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.sels select{width:100%}
.dl{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.dl i{display:block;height:100%;width:0;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:340px;display:grid;gap:10px}
.err{color:var(--accent);font-size:13px;min-height:1em}
footer{text-align:center;color:var(--dim);font-size:13px;padding:30px 16px 96px}footer a{color:var(--accent);text-decoration:none}
</style>

<body>
<header>
  <div class="logo" id="logo">mollad<b>_jaat</b></div>
  <input id="q" class="in" type="search" placeholder="Search anime…" autocomplete="off">
  <button class="ib" id="theme" aria-label="Toggle light or dark theme">◐</button>

<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
"use strict";
const $app=document.getElementById("app"),$q=document.getElementById("q"),$nav=document.getElementById("nav");
let SHOWS=null,NOW=0,POP=[],filter="all",lang="all",shown=60,hls=null,ME=null,PROG=[],FAVS=[],saveTimer=null,heroTimer=null,nextTimer=null,installEvt=null;
const META={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function h(tag,a,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(a||{})){if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,"");else if(v!==false&&v!=null)el.setAttribute(k,v)}for(const c of kids.flat())if(c!=null)el.append(c.nodeType?c:document.createTextNode(c));return el}
async function api(url,body){const o={headers:{}},t=store.get("token");if(t)o.headers.Authorization="Bearer "+t;
  if(body){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  const r=await fetch(url,o);let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||r.status);e.status=r.status;throw e}return j}
const go=x=>{location.hash=x};
let WTOK=0,curVideo=null;
let wdT=0;function killPlayer(){WTOK++;clearInterval(wdT);clearInterval(saveTimer);clearInterval(heroTimer);clearInterval(nextTimer);if(hls){hls.destroy();hls=null}if(curVideo){try{curVideo.pause();curVideo.removeAttribute("src");curVideo.load()}catch(e){}curVideo=null}}
function setTheme(t){document.documentElement.dataset.theme=t;store.set("theme",t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#0b0d13":"#f4f3ef"}
setTheme(store.get("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
document.getElementById("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});

/* ---------- bottom navigation ---------- */
function drawNav(){const cur=location.hash.replace(/^#\/?/,"").split("/")[0];
  const items=[["home","⌂","Home",()=>{$q.value="";filter="all";lang="all";go("#/");route()}],["list","♥","My List",()=>go("#/list")],["req","✉","Request",requestModal],["acct","☺","Account",()=>ME?accountModal():authModal()]];
  $nav.replaceChildren(...items.map(([k,i,l,f])=>h("button",{class:(k==="home"&&!["list","show","watch"].includes(cur))||k===cur?"on":"",onclick:f},h("span",{},i),l)))}

/* ---------- account ---------- */
let meReady=Promise.resolve();
async function loadMe(){if(store.get("token")){try{const j=await api("/api/me");ME=j.user;PROG=j.progress;FAVS=j.favs||[]}catch(e){if(e.status===401)store.del("token");ME=null;PROG=[];FAVS=[]}}}
function modal(...kids){const m=h("div",{class:"modal",onclick:e=>{if(e.target===m)m.remove()}},h("div",{class:"box"},...kids));document.body.append(m);return m}
function authModal(){let mode="login";
  const u=h("input",{class:"in",placeholder:"Username",autocomplete:"username"}),p=h("input",{class:"in",type:"password",placeholder:"Password",autocomplete:"current-password"}),err=h("div",{class:"err"});
  const forgot=h("a",{href:"https://t.me/mollad_jaat",target:"_blank",rel:"noopener",style:"font-size:13px;color:var(--accent)"},"Forgot password? Message @mollad_jaat on Telegram");
  const title=h("b",{style:"font-size:18px"},"Sign in"),sw=h("button",{class:"back",style:"margin:0"},"New here? Create an account"),ok=h("button",{class:"pri"},"Sign in");
  const m=modal(title,u,p,err,ok,sw,forgot);
  sw.onclick=()=>{forgot.style.display=mode==="login"?"none":"";mode=mode==="login"?"signup":"login";title.textContent=ok.textContent=mode==="login"?"Sign in":"Create account";sw.textContent=mode==="login"?"New here? Create an account":"Have an account? Sign in"};
  ok.onclick=async()=>{err.textContent="";try{const j=await api("/api/"+mode,{username:u.value.trim(),password:p.value});store.set("token",j.token);m.remove();await loadMe();route()}catch(e){err.textContent=e.message}};
  p.onkeydown=e=>{if(e.key==="Enter")ok.click()};u.focus()}
function accountModal(){
  const o=h("input",{class:"in",type:"password",placeholder:"Current password",autocomplete:"current-password"}),n=h("input",{class:"in",type:"password",placeholder:"New password (min 6)",autocomplete:"new-password"}),msg=h("div",{class:"err"});
  const save=h("button",{class:"btn"},"Change password");
  save.onclick=async()=>{msg.style.color="var(--accent)";msg.textContent="";try{await api("/api/password",{old:o.value,new:n.value});o.value=n.value="";msg.style.color="#1a8f4c";msg.textContent="Password changed."}catch(e){msg.textContent=e.message}};
  const inst=h("button",{class:"btn"},"Install app");
  inst.onclick=async()=>{if(installEvt){installEvt.prompt();installEvt=null}else alert("To install: open your browser menu and choose “Add to Home screen” (on iPhone: Share → Add to Home Screen).")};
  const m=modal(h("b",{style:"font-size:18px"},ME.username),o,n,msg,save,inst,
    h("button",{class:"btn",onclick:async()=>{try{await api("/api/logout",{})}catch(e){}store.del("token");ME=null;PROG=[];FAVS=[];m.remove();go("#/");route()}},"Sign out"))}
function requestModal(){
  const n=h("input",{class:"in",placeholder:"Anime name",maxlength:"120"});
  const m=modal(h("b",{style:"font-size:18px"},"Request an anime"),h("div",{class:"sub"},"Tell us what is missing. This opens Telegram with your message ready to send to @mollad_jaat."),n,
    h("button",{class:"pri",onclick:()=>{if(!n.value.trim())return;window.open("https://t.me/mollad_jaat?text="+encodeURIComponent("Anime request: "+n.value.trim()+(ME?" (user: "+ME.username+")":"")),"_blank");m.remove()}},"Send on Telegram"));n.focus()}

/* ---------- data ---------- */
async function loadShows(){if(SHOWS)return;$app.replaceChildren(h("p",{class:"muted"},"Loading…"));const j=await api("/api/shows");SHOWS=j.shows;NOW=j.now||Date.now()/1e3;POP=j.popular||[]}
const bySlug=s=>SHOWS.find(x=>x.slug===s);
const isNew=s=>s.upd&&NOW-s.upd<7*86400;
async function getVids(s){if(META[s.slug])return META[s.slug];let v=[];try{const m=await api("/meta/"+(s.movie?"movie":"series")+"/raretoons2:"+encodeURIComponent(s.slug)+".json");v=(m.meta&&m.meta.videos)||[]}catch(e){}return META[s.slug]=v}
function posterEl(s){const f=()=>h("div",{class:"ph"},(s.name[0]||"?").toUpperCase());if(!s.poster)return f();
  const i=h("img",{class:"poster",loading:"lazy",alt:"",referrerpolicy:"no-referrer",src:s.poster});i.onerror=()=>i.replaceWith(f());return i}
function card(s,pct,onclick){return h("button",{class:"card",onclick:onclick||(()=>go("#/show/"+s.slug))},posterEl(s),isNew(s)&&pct==null?h("div",{class:"badge"},"NEW"):null,pct!=null?h("div",{class:"prog"},h("i",{style:"width:"+pct+"%"})):null,h("div",{class:"t"},s.name))}
const ago=t=>{const d=Math.max(0,NOW-t);return d<3600?Math.max(1,Math.round(d/60))+"m ago":d<86400?Math.round(d/3600)+"h ago":Math.round(d/86400)+"d ago"};
const epLink=s=>s.le?"#/watch/"+s.slug+"/"+s.le[0]+"/"+s.le[1]:"#/show/"+s.slug;
function epCard(s){const nw=isNew(s);return h("button",{class:"card",onclick:()=>go(epLink(s))},posterEl(s),nw?h("div",{class:"badge"},"NEW"):null,
  s.le?h("div",{class:"ept",style:"margin-top:6px"},"S"+s.le[0]+" · E"+s.le[1],nw?h("span",{}," · "+ago(s.upd)):null):null,h("div",{class:"t",style:"min-height:2.6em"},s.name))}
const resumeLink=(s,p)=>"#/watch/"+s.slug+(s.movie?"":"/"+p.season+"/"+p.episode);
const bgStyle=s=>s.poster?"background-image:url('"+s.poster.replace(/'/g,"%27")+"')":"";
async function toggleFav(slug){if(!ME)return authModal();const on=!FAVS.includes(slug);try{await api("/api/fav",{slug,on});FAVS=on?[slug,...FAVS]:FAVS.filter(x=>x!==slug)}catch(e){}}

/* ---------- home ---------- */
function rail(title,list,more,mk){return list.length?[h("h2",{class:"sec"},title,more?h("button",{class:"see",onclick:more},"See all ›"):null),h("div",{class:"rail"},list.map(mk||(s=>card(s))))]:[]}
function heroEl(items){
  const box=h("div",{class:"hero"});let i=0;
  function draw(){const {s,p}=items[i],nw=isNew(s);box.replaceChildren(h("div",{class:"bg",style:bgStyle(s)}),
    h("div",{class:"hin"},h("div",{class:"hp"},posterEl(s)),
    h("div",{class:"in2"},h("span",{class:"tag"},p?"Continue watching":nw&&s.le?"New episode · S"+s.le[0]+" E"+s.le[1]:"Featured"),h("h1",{},s.name),
      h("div",{class:"row2",style:"margin-top:6px"},h("button",{class:"pri",onclick:()=>go(p?resumeLink(s,p).slice(1):nw?epLink(s).slice(1):"#/show/"+s.slug)},p?"▶ Resume"+(s.movie?"":" S"+p.season+" E"+p.episode):"▶ Watch now"),h("button",{class:"glass",onclick:()=>go("#/show/"+s.slug)},"Details")))),
    items.length>1?h("div",{class:"dots"},items.map((_,k)=>h("i",{class:k===i?"on":""}))):null)}

const A=s=>s.kind!=="cartoon";
function home(){killPlayer();const term=$q.value.trim().toLowerCase(),browsing=term||filter!=="all"||lang!=="all";

    const heroItems=[...cont.slice(0,1),...latest.filter(s=>s.poster).slice(0,4).map(s=>({s}))];
    if(heroItems.length)kids.push(heroEl(heroItems));
    kids.push(...rail("Latest episodes",fresh.slice(0,20),null,epCard));
    if(ME)kids.push(...rail("Continue watching",cont.slice(0,15),null,({p,s})=>card(s,p.dur?Math.min(100,p.pos/p.dur*100):0,()=>go(resumeLink(s,p).slice(1)))));
    if(ME)kids.push(...rail("My List",FAVS.map(bySlug).filter(Boolean).slice(0,20),()=>go("#/list")));
    kids.push(...rail("Recently added",recent.slice(0,20),null,epCard));
    const pop=POP.map(bySlug).filter(Boolean);if(pop.length>=4)kids.push(...rail("Popular on mollad_jaat",pop));
    for(const L of ["Hindi","Tamil","Telugu"]){const l=SHOWS.filter(s=>(s.langs||[]).includes(L)&&!s.movie&&A(s)&&s.poster).sort((a,b)=>b.upd-a.upd||a.name.localeCompare(b.name)).slice(0,20);
      kids.push(...rail(L+" anime",l,()=>{lang=L;filter="anime";shown=60;home()}))}

/* ---------- download ---------- */
async function downloadLevel(uri,name,bar,label){

/* ---------- watch ---------- */

async function route(){try{await loadShows();const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);scrollTo(0,0);drawNav();
