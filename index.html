<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>mollad_jaat — Watch Anime</title>
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f3ef;--panel:#fff;--panel2:#eeebe5;--line:#e3dfd7;--text:#16181f;--dim:#6a6f7e;--accent:#ff4d2e;--accent2:#ff8a3d;--green:#22c993;--glass:rgba(245,243,239,.88);--shadow:0 6px 22px rgba(20,20,30,.08)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0a0d;--panel:#141419;--panel2:#1c1c24;--line:#25252f;--text:#f2f3f7;--dim:#9a9fb0;--accent:#ff5330;--accent2:#ff8f45;--green:#2fd6a1;--glass:rgba(10,10,13,.88);--shadow:0 8px 26px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
select{color:var(--text)}
.in::placeholder{color:var(--dim);opacity:1}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--panel2) inset;-webkit-text-fill-color:var(--text);caret-color:var(--text)}
html.lock,html.lock body{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center}
.logo{font-weight:900;font-style:italic;font-size:21px;cursor:pointer;white-space:nowrap;letter-spacing:-.5px;text-transform:uppercase}.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.in,select{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:0}
.in:focus,select:focus{border-color:var(--accent)}
select{border-radius:12px;padding:9px 12px}
#q{flex:1;min-width:0}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .18s ease,border-color .2s}
.ib:active{transform:scale(.88)}
.ti{position:relative;display:block;width:20px;height:20px}
.ti svg{position:absolute;top:0;left:0;width:20px;height:20px;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
.ti .sun{color:var(--accent2);opacity:0;transform:rotate(-100deg) scale(.3)}
.ti .moon{color:var(--text);opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .sun{opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .moon{opacity:0;transform:rotate(100deg) scale(.3)}
html.tx,html.tx *,html.tx *::before,html.tx *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease,box-shadow .35s ease!important}
.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:700;border-radius:14px;padding:12px 24px;box-shadow:0 6px 18px rgba(255,83,48,.35);transition:transform .12s}
.pri:active{transform:scale(.97)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 16px}
main{max-width:1180px;margin:0 auto;padding:6px 16px calc(var(--nh,70px) + 28px);min-height:70vh}
html{scroll-padding-bottom:calc(var(--nh,70px) + 16px)}
.ep,.card{scroll-margin-bottom:calc(var(--nh,70px) + 16px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 0;border-radius:12px;flex:1 1 0;min-width:0;transition:color .2s}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.dots{position:absolute;right:16px;top:16px;display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.4);transition:width .25s}.dots i.on{background:var(--accent);width:20px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 20px;font-weight:600}
.see{background:none;border:0;color:var(--accent);font-size:13px;font-weight:700}
.ep.seen{opacity:.55}.ep.seen::before{content:"✓";position:absolute;top:2px;left:6px;font-size:10px;color:var(--accent)}
.countdown{position:absolute;right:12px;bottom:56px;background:rgba(0,0,0,.8);color:#fff;border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:14px;z-index:2}
.countdown div{display:flex;gap:8px}.countdown button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:7px 12px}.countdown .go{background:var(--accent)}
.chk{display:flex;gap:10px;align-items:center}
.sub{font-size:12px;color:var(--dim)}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:330px;display:flex;align-items:flex-end;margin:8px 0 12px;background:var(--panel2);box-shadow:var(--shadow)}
.hero{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.25);filter:blur(26px) brightness(.62) saturate(1.2);animation:hfade .45s ease-out}
.hero.land .bg{transform:scale(1.02);filter:none}
.hero .art{position:absolute;z-index:1;right:18px;top:38px;height:150px;width:auto;max-width:42%;border-radius:12px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:hfade .45s ease-out}
.hero.land .art{display:none}
@keyframes hfade{from{opacity:0}to{opacity:1}}
.seg{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;gap:5px}
.seg button{flex:1;height:4px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.seg .done i{width:100%}.seg .on i{animation:segfill linear forwards}
@keyframes segfill{from{width:0}to{width:100%}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 35%,rgba(10,10,13,.94) 100%)}
.hero .hin{position:relative;z-index:1;padding:18px 18px 20px;color:#fff;width:100%}
.hero .in2{min-width:0;max-width:620px}
.hero h1{margin:8px 0 4px;font-size:28px;line-height:1.08;font-weight:900;font-style:italic;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero .meta{font-size:13px;color:#e4e6ee;font-weight:500}
.hero .pri,.hero .glass{padding:11px 22px;font-size:15px}
.hero .pri{flex:1 1 0;max-width:220px}.hero .glass{flex:1 1 0;max-width:180px}
.ept{padding:0;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}.ept span{color:var(--dim);font-weight:500}
.tag{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:8px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}

h2.sec{font-size:19px;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}

/* rails & grid: wide, short thumbnails */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:236px;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:16px;margin:0 -16px;padding-left:16px;padding-right:16px}.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;width:100%;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s;display:block}
@media(hover:hover){.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}}
.card:active{transform:scale(.965);transition-duration:.08s}
.pw{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:var(--panel2)}
.pw .poster,.pw .ph{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center 22%}
.pw .bgb{position:absolute;top:-12px;right:-12px;bottom:-12px;left:-12px;background-size:cover;background-position:center;filter:blur(16px) brightness(.62) saturate(1.2);display:none}
.pw.pt .bgb{display:block}.pw.pt .poster{object-fit:contain;object-position:center}
.ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--accent);background:linear-gradient(135deg,var(--panel2),var(--panel))}
.ov{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:6px;padding:18px 8px 7px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7));pointer-events:none}
.ov span{font-size:10.5px;font-weight:700;color:#fff;line-height:1;border-radius:6px;padding:4px 7px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.ov .en{margin-left:auto;background:rgba(0,0,0,.45)}
.t{padding:9px 12px 11px;font-size:13px;font-weight:600;line-height:1.3}
.t b{display:block;font-weight:700;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.t small{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--dim)}
.rt{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.72);color:#ffd45e;font-size:11px;font-weight:800;border-radius:7px;padding:3px 7px}
.badge{position:absolute;top:8px;left:8px;background:var(--green);color:#04130e;font-size:10.5px;font-weight:900;letter-spacing:.5px;border-radius:7px;padding:3px 9px}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:var(--hh,62px);z-index:4;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:600}.tab[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.muted{color:var(--dim)}.back{background:none;border:0;color:var(--dim);padding:0;margin:8px 0 12px;font-weight:600}

/* detail */
.top{position:relative;border-radius:22px;overflow:hidden;padding:0;margin-bottom:6px;background:var(--panel2);box-shadow:var(--shadow)}
.top .bg{position:absolute;inset:-14px;background-size:cover;background-position:center;filter:blur(28px) brightness(.4)}
.detail{position:relative;display:grid;grid-template-columns:1fr;gap:0;color:#fff}
.detail .pw{border-radius:0}
.detail .dtx{padding:16px 18px 20px}
.detail h1{margin:0 0 6px;font-size:25px;line-height:1.12;font-weight:900;font-style:italic;letter-spacing:-.4px}.detail .muted{color:#d5d8e2}
@media(min-width:760px){.detail{grid-template-columns:380px 1fr;align-items:center}.detail .dtx{padding:22px}}

.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 0;font-weight:700;position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ep:hover,.ep.cur{border-color:var(--accent);color:var(--accent)}.ep.cur::after{content:"●";position:absolute;top:2px;right:6px;font-size:8px}
.player{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:var(--shadow)}
video{width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:rgba(0,0,0,.7)}
.buf{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;display:none;pointer-events:none}.epbox{margin-top:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;display:grid;gap:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:600}.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seekrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seekrow .chip{text-align:center}
@media(min-width:420px){.seekrow{grid-template-columns:repeat(4,1fr)}}
.sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.sels select{width:100%}
.dl{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.dl i{display:block;height:100%;width:0;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;width:100%;max-width:340px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:stretch;gap:12px;box-shadow:var(--shadow);animation:pop .2s ease-out;max-height:calc(100% - 8px);overflow-y:auto}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.box>*{min-width:0;max-width:100%}
.box .in,.box .pri,.box .btn,.box .back{display:block;width:100%}
.box .in{background:var(--panel2);font-size:16px}
.box .in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,83,48,.16)}
.box .back{text-align:center;padding:6px 0;margin:0;white-space:normal}
.box .pri{padding:13px 16px}
.err{color:var(--accent);font-size:13px;min-height:1em}
footer{text-align:center;color:var(--dim);font-size:13px;padding:30px 16px 96px}footer a{color:var(--accent);text-decoration:none}


/* search overlay */
.spill{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--dim);text-align:left}
.spill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spill svg{flex:0 0 auto}
.so{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;overscroll-behavior:contain;background:var(--bg);display:flex;flex-direction:column;animation:soin .18s ease-out}
@keyframes soin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sobar{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.sobar .in{flex:1;min-width:0;font-size:16px}
.socancel{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 2px}
.sobody{padding-bottom:calc(40px + env(safe-area-inset-bottom))!important;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 16px 40px;max-width:720px;width:100%;margin:0 auto}
.sobody::-webkit-scrollbar{display:none;width:0;height:0}
.sohd{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.sohd button{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
.rec{display:flex;flex-wrap:wrap;gap:8px}
.rec .chip{display:inline-flex;align-items:center;gap:8px}.rec .chip i{font-style:normal;color:var(--dim);padding:0 2px}
.sr{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-radius:14px;padding:8px;text-align:left}
.sr:hover,.sr:active{background:var(--panel)}
.sr .th{flex:0 0 112px;border-radius:10px;overflow:hidden;position:relative}.sr .pw{border-radius:10px}.sr .ph{font-size:22px}
.sr b{display:block;font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.sr mark{background:none;color:var(--accent)}
.sr .rk{flex:0 0 22px;font-weight:900;font-style:italic;color:var(--accent);font-size:18px;text-align:center}
.sall{width:100%;margin-top:10px}

.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-card{pointer-events:none}.sk-card .t{display:grid;gap:7px;padding:12px}
.sk-l{height:11px;border-radius:6px}.sk-l.s{width:55%}.sk-h{display:inline-block;width:150px;height:18px;border-radius:8px}
.hero.sk{box-shadow:none}.hero.sk::after{display:none}.ep.sk{height:42px;border:0}

/* player: one compact control bar + big next button */
.nextbar{display:flex;gap:10px;margin-top:12px}
.nextbar .nx{flex:1;min-width:0;padding:14px 18px;font-size:16px;border-radius:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbar .pv{border-radius:14px;padding:0 18px;font-weight:700}
.cbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;display:grid;gap:10px}
.lrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.lrow::-webkit-scrollbar{display:none}
.lrow .chip{flex:0 0 auto;white-space:nowrap}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seekgrp{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.sb{background:none;border:0;padding:8px 0;width:54px;font-weight:700;font-size:13px}.sb+.sb{border-left:1px solid var(--line)}.sb:active{background:var(--line)}
.csel{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.csel select{padding:7px 10px;font-size:13px;width:auto;max-width:150px}
.panel.slim{padding:12px 14px;gap:10px}
@media(prefers-reduced-motion:reduce){.sk,.seg .on i,.hero .bg,.hero .art{animation:none}.seg .on i{width:100%}}

/* old-browser (old TV Chrome) fallbacks */
@supports not (aspect-ratio:16/9){.pw{height:120px}.player{height:0;padding-bottom:56.25%}.player video{position:absolute;top:0;left:0}}
@supports not (inset:0){.hero .bg,.hero::after,.msg,.modal,.top .bg{top:0;right:0;bottom:0;left:0}}
.chips>*,.row2>*,.filters>*{margin:0 8px 8px 0}
.dots i{margin-left:5px}
@media(min-width:760px){.hero .art{right:32px;top:40px;bottom:32px;height:auto;max-height:calc(100% - 72px)}.rail{grid-auto-columns:280px;margin:0;padding-left:0;padding-right:0}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.hero{min-height:420px}.hero h1{font-size:40px}.hero .hin{padding:30px}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">mollad<b>_jaat</b></div>
  <button class="spill" id="sbtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span id="sbtxt">Search anime…</span></button>
