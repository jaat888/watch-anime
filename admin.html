<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--acc:#6c8cff;--red:#ff5d6c;--grn:#3ecf8e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  input{background:#0f1115;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font-size:15px;width:100%}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
  button.red{background:var(--red)} button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
  .row{display:flex;gap:8px;align-items:center}
  .msg{margin-top:10px;font-size:14px;min-height:20px}.err{color:var(--red)}.ok{color:var(--grn)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--mut);font-weight:500}
  .tw{overflow-x:auto}
  .stat{font-size:28px;font-weight:600}.mut{color:var(--mut);font-size:13px}
  .hide{display:none}
  select{background:#0f1115;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:14px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button.on{background:var(--acc)}.tabs button:not(.on){background:transparent;border:1px solid var(--line);color:var(--tx)}
  .logs{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:70vh;overflow:auto;background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
  .ln{padding:2px 0;border-bottom:1px solid #161a21;word-break:break-word;white-space:pre-wrap}
  .ln .t{color:var(--mut)}.ln .s{color:var(--acc)}.ln.warn .m{color:#f5c04a}.ln.error .m{color:var(--red)}
  .wrapx{flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin Panel</h1>

  <div id="login" class="card">
    <div class="mut" style="margin-bottom:8px">Enter your ADMIN_KEY</div>
    <div class="row">
      <input id="key" type="password" placeholder="Admin key" autocomplete="off">
      <button id="go">Login</button>
    </div>
    <div id="lmsg" class="msg"></div>
  </div>

  <div id="panel" class="hide">
    <div class="tabs"><button id="tUsers" class="on">Users</button><button id="tLogs">Logs</button></div>
    <div id="vLogs" class="hide">
      <div class="card">
        <div class="row wrapx">
          <select id="lvl"><option value="all">All</option><option value="warn">Warnings+</option><option value="error">Errors</option></select>
          <select id="src"><option value="">All sources</option></select>
          <input id="ltext" placeholder="Search text..." style="flex:1;min-width:120px">
        </div>
        <div class="row wrapx" style="margin-top:8px">
          <button class="ghost" id="lref">Refresh</button>
          <button class="ghost" id="lmore">Older</button>
          <label class="mut"><input type="checkbox" id="lauto" style="width:auto"> auto (5s)</label>
          <button class="red" id="lclr" style="margin-left:auto">Clear</button>
        </div>
        <div id="lstat" class="mut" style="margin-top:8px"></div>
        <div id="lbox" class="logs"></div>
      </div>
    </div>
    <div id="vUsers">
    <div class="card row" style="justify-content:space-between">
      <div><div class="mut">Total users</div><div class="stat" id="total">0</div></div>
      <div class="row">
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="logout">Logout</button>
      </div>
    </div>
    <div class="card">
      <input id="search" placeholder="Search username...">
      <div id="msg" class="msg"></div>
      <div class="tw"><table>
        <thead><tr><th>Username</th><th>Joined</th><th>Last seen</th><th>History</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let KEY = "", USERS = [];
try { KEY = sessionStorage.getItem("ak") || ""; } catch(e) {}

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "POST",
    headers: {"X-Admin-Key": KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });
  let j = {};
  try { j = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
function fmt(t) {
  if (!t) return "-";
  t = Number(t); if (t < 1e12) t *= 1000;
  return new Date(t).toLocaleString();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function say(el, t, cls) { el.textContent = t; el.className = "msg " + (cls || ""); }

function render() {
  const f = $("search").value.trim().toLowerCase();
  const list = USERS.filter(u => u.username.toLowerCase().includes(f));
  $("rows").innerHTML = list.map(u => `<tr>
    <td>${esc(u.username)}</td><td>${fmt(u.created)}</td><td>${fmt(u.last_seen)}</td><td>${u.history}</td>
    <td class="row"><button class="ghost" data-a="pw" data-u="${esc(u.username)}">Password</button>
    <button class="red" data-a="del" data-u="${esc(u.username)}">Delete</button></td></tr>`).join("")
    || `<tr><td colspan="5" class="mut">No users</td></tr>`;
}
async function load() {
  const j = await api("/api/admin/stats");
  USERS = j.users; $("total").textContent = j.total; render();
}
async function login() {
  KEY = $("key").value.trim() || KEY;
  try {
    await load();
    try { sessionStorage.setItem("ak", KEY); } catch(e) {}
    $("login").classList.add("hide"); $("panel").classList.remove("hide");
  } catch(e) { say($("lmsg"), e.message, "err"); }
}
$("go").onclick = login;
$("key").onkeydown = e => { if (e.key === "Enter") login(); };
$("search").oninput = render;
$("refresh").onclick = () => load().then(() => say($("msg"), "Refreshed", "ok")).catch(e => say($("msg"), e.message, "err"));
$("logout").onclick = () => { try { sessionStorage.removeItem("ak"); } catch(e) {} location.reload(); };
$("rows").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  const u = b.dataset.u;
  try {
    if (b.dataset.a === "pw") {
      const p = prompt("New password for " + u + " (min 6 characters):");
      if (!p) return;
      await api("/api/admin/password", {username: u, password: p});
      say($("msg"), "Password changed for " + u + " (user logged out everywhere)", "ok");
    } else {
      if (!confirm("Delete user " + u + "? This cannot be undone.")) return;
      await api("/api/admin/delete", {username: u});
      say($("msg"), u + " deleted", "ok"); await load();
    }
  } catch(err) { say($("msg"), err.message, "err"); }
};

// ---- Logs ----
let LOGS = [], LTIMER = null;
const pad = n => String(n).padStart(2, "0");
function lt(ts) { const d = new Date(ts * 1000); return pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
function drawLogs() {
  $("lbox").innerHTML = LOGS.map(r => `<div class="ln ${esc(r.lvl)}"><span class="t">${lt(r.ts)}</span> <span class="s">[${esc(r.src)}]</span> <span class="m">${esc(r.msg)}</span></div>`).join("") || '<div class="mut">No log lines</div>';
}
async function loadLogs(older) {
  const before = older && LOGS.length ? LOGS[LOGS.length - 1].id : 0;
  const j = await api("/api/admin/logs", {limit: 200, level: $("lvl").value, src: $("src").value, text: $("ltext").value.trim(), before});
  LOGS = older ? LOGS.concat(j.rows) : j.rows;
  const cur = $("src").value;
  $("src").innerHTML = '<option value="">All sources</option>' + j.sources.map(s => `<option ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("");
  const st = j.stats || {};
  $("lstat").textContent = `${LOGS.length} lines · stored in ${j.origin === "db" ? "SQL" : "MEMORY ONLY (SQL unreachable)"} · queued ${st.pending || 0} · saved ${st.saved || 0} · db errors ${st.db_errors || 0}` + (st.last_db_error ? " · " + st.last_db_error : "");
  drawLogs();
}
const lerr = e => say($("lstat"), e.message, "err");
function tab(t) {
  $("vUsers").classList.toggle("hide", t !== "u"); $("vLogs").classList.toggle("hide", t !== "l");
  $("tUsers").className = t === "u" ? "on" : ""; $("tLogs").className = t === "l" ? "on" : "";
  if (t === "l") loadLogs().catch(lerr);
}
$("tUsers").onclick = () => tab("u"); $("tLogs").onclick = () => tab("l");
$("lref").onclick = () => loadLogs().catch(lerr);
$("lmore").onclick = () => loadLogs(true).catch(lerr);
$("lvl").onchange = $("src").onchange = () => loadLogs().catch(lerr);
$("ltext").onkeydown = e => { if (e.key === "Enter") loadLogs().catch(lerr); };
$("lclr").onclick = async () => { if (!confirm("Delete ALL logs?")) return; try { await api("/api/admin/logs/clear"); await loadLogs(); } catch(e) { lerr(e); } };
$("lauto").onchange = () => { clearInterval(LTIMER); if ($("lauto").checked) LTIMER = setInterval(() => loadLogs().catch(() => {}), 5000); };
if (KEY) { $("key").value = KEY; login(); }
</script>
</body>
</html>
